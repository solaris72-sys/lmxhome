<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMX Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="login" class="login" hidden>
    <h1>LMX Home</h1>
    <form id="login-form">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Unlock</button>
      <p class="error" id="login-error"></p>
    </form>
  </main>

  <div id="app" hidden>
    <header class="topbar">
      <div>
        <h1>LMX Home</h1>
        <p class="today" id="today"></p>
      </div>
      <div class="actions">
        <span class="sync" id="sync-status"></span>
        <button class="link" id="refresh">Refresh</button>
        <button class="link" id="logout">Log out</button>
      </div>
    </header>

    <div class="problems" id="problems" hidden></div>
    <p class="focus" id="focus" hidden></p>

    <div class="layout">
      <div class="main-col">
        <section class="card" id="coming-up-card">
          <div class="card-head">
            <h2>Coming up</h2>
            <button class="link" id="show-cleared" hidden></button>
          </div>
          <ul class="coming" id="coming-up"></ul>
        </section>

        <div id="agendas"></div>

        <section>
          <div class="section-head">
            <h2>To do</h2>
            <nav class="tabs" id="roadmap-tabs"></nav>
            <label class="show-done"><input type="checkbox" id="show-done"> Show done</label>
          </div>
          <div id="roadmap"></div>
        </section>
      </div>

      <div class="side-col">
        <section class="card" id="calendar-card">
          <div class="card-head">
            <h2>Calendar</h2>
            <button class="small" id="new-reminder">+ Reminder</button>
          </div>
          <div id="calendar"><p class="hint">Loading…</p></div>
          <p class="cal-foot"><a href="https://calendar.google.com/calendar/r" target="_blank" rel="noopener">Open Google Calendar</a></p>
        </section>
        <section>
          <h2>Apps</h2>
          <div class="apps" id="apps"><p class="hint">Loading…</p></div>
        </section>
        <section>
          <h2>Recent work</h2>
          <div id="sessions"></div>
        </section>
      </div>
    </div>
  </div>

  <dialog id="reminder" class="reminder">
    <form id="reminder-form" method="dialog">
      <h2>Add to Google Calendar</h2>
      <label>What
        <input id="rem-text" required>
      </label>
      <div class="rem-when">
        <label>Date
          <input type="date" id="rem-date" required>
        </label>
        <label>Time <span class="hint">(optional)</span>
          <input type="time" id="rem-time">
        </label>
      </div>
      <label>Notes <span class="hint">(optional)</span>
        <textarea id="rem-notes" rows="2"></textarea>
      </label>
      <p class="hint">Opens Google Calendar with this filled in. Tap Save there; it uses your usual notification settings.</p>
      <div class="rem-buttons">
        <button type="button" class="link" id="rem-cancel">Cancel</button>
        <button type="submit">Open in Google Calendar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
